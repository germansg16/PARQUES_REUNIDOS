name: eco_guardianes
description: "Eco-Guardianes del Parque - App gamificada de reciclaje para Parques Reunidos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Estado ──────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Navegación ──────────────────────────────────────────
  go_router: ^14.0.0

  # ── Mapas ───────────────────────────────────────────────
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

  # ── Scanner QR ──────────────────────────────────────────
  mobile_scanner: ^5.2.1

  # ── Ruleta ──────────────────────────────────────────────
  flutter_fortune_wheel: ^1.3.1
  rxdart: ^0.27.7

  # ── Códigos de Barras ───────────────────────────────────
  barcode_widget: ^2.0.4

  # ── UI / Animaciones ────────────────────────────────────
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  animated_text_kit: ^4.2.3

  # ── Utilidades ──────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
